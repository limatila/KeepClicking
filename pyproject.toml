[project]
name = "keepclicking"
version = "0.1.0"
description = "Voice-activated mouse control 24/7"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "numpy>=2.4.6,<3",
    "sounddevice>=0.5.5,<0.6",
    "pyautogui>=0.9.54,<1",
    "python-dotenv>=1.2.2,<2",
    "rapidfuzz>=3.14.1,<4",
    "openwakeword==0.6.0",
    "onnxruntime>=1.24.1,<2",
    "vosk>=0.3.45",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "faker>=40.19.1,<41",
    "pyinstaller>=6.16,<7",
]
